<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchs NBA</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    /* Styles CSS personnalisés */
    .center-vs {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="text-center my-4">Liste des Matchs NBA</h1>
    <div class="row">
      <div class="col-md-12">
        <ul class="list-group">
          <li class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
              <span class="mr-auto">Los Angeles Lakers</span>
              <span class="center-vs">vs</span>
              <span class="ml-auto">Golden State Warriors</span>
            </div>
          </li>
          <li class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
              <span class="mr-auto">Brooklyn Nets</span>
              <span class="center-vs">vs</span>
              <span class="ml-auto">Miami Heat</span>
            </div>
          </li>
          <li class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
              <span class="mr-auto">Chicago Bulls</span>
              <span class="center-vs">vs</span>
              <span class="ml-auto">Boston Celtics</span>
            </div>
          </li>
          <!-- Ajoutez d'autres matchs selon votre besoin -->
        </ul>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (si nécessaire) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
